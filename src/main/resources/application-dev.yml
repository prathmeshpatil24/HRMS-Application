server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hrms_db
    username: root
    password: system@1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true